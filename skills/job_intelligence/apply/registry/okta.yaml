name: okta
version: 1

detect:
  domains:
    - careers.okta.com
  source_keywords:
    - "careers.okta.com"
    - "okta.com/careers"

probe:
  best_strategy: standard

patterns:
  already_applied:
    - "already applied"

properties:
  multi_page: true
  has_eeo: true

notes: |
  Okta Careers is a multi-step application form. Standard HTML fields; login wall common. Root okta.com is NOT matched.
