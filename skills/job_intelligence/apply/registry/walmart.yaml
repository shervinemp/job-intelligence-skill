name: walmart
version: 1

detect:
  domains:
    - careers.walmart.com
  source_keywords:
    - "careers.walmart.com"
    - "walmart.com/careers"

probe:
  best_strategy: standard

patterns:
  already_applied:
    - "already applied"

properties:
  multi_page: true
  has_eeo: true

notes: |
  Walmart Careers is a multi-step application portal. Standard HTML fields; login wall common. Root walmart.com is NOT matched.
