name: greenhouse
version: 2

detect:
  domains:
    - greenhouse.io
    - boards.greenhouse.io
    - grnh.se
  # Apply URLs can sit on a customer's branded domain while naming the
  # engine via query params or the greenhouse JS bundle.
  query_params:
    - gh_jid
    - gh_src
  source_keywords:
    - "boards.greenhouse.io"
    - "gh_jid"
    - "greenhouse.io/embed"
    - "grnh.se"

url_normalize:
  # boards.greenhouse.io/<co>/jobs/<id>/ (trailing slash) drops ?gh_jid —
  # normalize the canonical URL so the query string survives navigation.
  - pattern: '^(https?://boards\.greenhouse\.io/[^/]+/jobs/\d+)/+(\?|$)'
    replace: '\1\2'

url_rewrites:
  # boards.greenhouse.io/<co>/jobs/<id> redirects to branded SPA career pages
  # that can break under automation; the embed endpoint is always server-rendered.
  # Pattern must match the WHOLE URL (anchored) so replace yields a clean URL.
  - pattern: '^https?://boards\.greenhouse\.io/([^/]+)/jobs/(\d+).*$'
    replace: 'https://job-boards.greenhouse.io/embed/job_app?for=\1&token=\2'

probe:
  best_strategy: standard

patterns:
  login_wall:
    - "sign in to apply"
    - "already have an account"
  guest_apply:
    - "continue without signing in"
    - "apply as guest"
  already_applied:
    - "you have already applied for this role"
    - "you've already applied"
    - "already applied"

properties:
  multi_page: true
  has_eeo: false
  has_progress_bar: false
  page_range: [1, 5]

notes: |
  No <select> — all custom autocomplete. Country = <input>.
  "Submit application" = real button ("Apply" = scroll trigger).
  Confirmation renders in iframe after submit.
