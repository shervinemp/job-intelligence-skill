name: workday
version: 3
notes: |
  7-step SPA (Info → Experience → Questions → Disclosures → Review).
  DROPDOWN = button[aria-haspopup]. Phone: strip +1 prefix.
  Skills autocomplete: type skill then press Enter. Per-company login.
  Login: defaults to Create Account form. _handle_login_wall clicks
  Sign In link (data-automation-id="signInLink") before filling creds.
  Honeypot: "website" field with "for robots" label — filtered by _is_junk_field.

detect:
  domains:
    - myworkdayjobs.com
    - myworkdayjobs.wd5.myworkdayjobs.com
    - myworkdayjobs.wd1.myworkdayjobs.com
    - myworkdaysite.com
    - workday.com
    - workdayjobs.com
    - wday.com
  # Workday customer career pages live on the employer's domain; the engine
  # is identified by the workday JS bundle path in the page source.
  # DELIBERATELY no bare "Workday"/"workday" keyword — it appears in job
  # descriptions as "Workday experience" and would false-classify any page
  # that merely mentions the product.
  source_keywords:
    - "wd5.myworkdayjobs.com"
    - "myworkdayjobs.com"
    - "myworkdayjobs.wd5"
    - "myworkdaysite.com"
    - "workdayprd"
    - "wdrun"

probe:
  best_strategy: dialog
  widgets:
    dropdown: "button[aria-haspopup='listbox']"
    autocomplete: "input[role='combobox']"

patterns:
  login_wall:
    - "sign in to apply"
    - "sign in with email"
    - "create account"
  guest_apply:
    - "continue without signing in"
    - "apply as guest"
    - "apply manually"
  already_applied:
    - "already applied"
    - "you have already submitted an application"
    - "previously applied"

properties:
  multi_page: true
  has_eeo: true
  has_progress_bar: true
  page_range: [3, 7]

# Per-field fill semantics (COMPARISON §S4). Workday's widgets are fiber-
# driven; generic click-the-first-suggestion fails. These hints select the
# protocol per field class:
#   enter_to_confirm: type the value then press Enter (skills/school
#     typeahead accepts Enter, not a click on the suggestion)
#   clear_field_errors: before filling, clear the field's error state
#     (Workday keeps a "requires a value" red underline until corrected)
fill:
  hints:
    skills_enter: true
    clear_field_errors: true
