name: isolved
version: 1

detect:
  domains:
    - isolved.com
    - careers.isolved.com
  source_keywords:
    - "isolved.com"

probe:
  best_strategy: standard

patterns:
  already_applied:
    - "already applied"

properties:
  multi_page: true
  has_eeo: true

notes: |
  iSolved HCM career sites are multi-step application forms. Standard HTML fields; login wall common.
