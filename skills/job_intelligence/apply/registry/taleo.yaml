name: taleo
version: 1

detect:
  domains:
    - taleo.net
    - tbe.taleo.net
  # "oraclecloud" belongs to the separate oraclecloud.yaml (Oracle Cloud HCM)
  # — keeping it here would misclassify Oracle Cloud pages as Taleo. Bare
  # "taleo" is a proper noun; only the domain markers classify.
  source_keywords:
    - "taleo.net"
    - "tbe.taleo.net"

probe:
  best_strategy: standard

patterns:
  already_applied:
    - "already applied"

properties:
  multi_page: true
  has_eeo: true

notes: |
  Oracle Taleo applications are classic multi-step server-rendered forms
  (Contact → Resume → Questions → Review). Standard HTML inputs + file
  uploads; login wall common (existing account prompt). detect covers both
  taleo.net and the TBE (Talent Business Experience) subdomain.
