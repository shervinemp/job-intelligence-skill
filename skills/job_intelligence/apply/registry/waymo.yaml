name: waymo
version: 1

detect:
  domains:
    - waymo.com
  source_keywords:
    - "waymo.com/careers"

probe:
  best_strategy: standard

patterns:
  already_applied:
    - "already applied"

properties:
  multi_page: true
  has_eeo: true

notes: |
  Waymo Careers is a multi-step application form. Standard HTML fields; login wall common. Only /careers is a source keyword.
