name: linkedin
version: 2

detect:
  domains:
    - linkedin.com

probe:
  best_strategy: dialog
  widgets: {}

patterns:
  already_applied:
    - "applied"
  easy_apply:
    - "easy apply"

properties:
  multi_page: true
  has_eeo: false
  has_progress_bar: true
  page_range: [1, 10]


notes: |
  Easy Apply modal via LinkedinHandler. Ember.js: click+events, not nativeValueSetter.
  Resume names in <span> (labels empty). Upload via file chooser.
  External via legacy flow. Uses <dialog open> not [role="dialog"].
