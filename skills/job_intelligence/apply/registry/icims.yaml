name: icims
version: 1

detect:
  domains:
    - icims.com
  # iCIMS embeds its application form in an iframe on the employer's
  # branded career portal — the customer hostname never contains icims.com.
  iframe_only: true
  source_keywords:
    - "icims.com"
    - "jobs.icims.com"
    - "icims_candidate_application"

properties:
  multi_page: true
  has_eeo: true

notes: |
  iCIMS job pages load the application form inside an iframe. The outer
  page is often the company's branded career portal. Pipeline navigates
  directly to the iCIMS URL — the form may be inline or inside an iframe.
  The probe cascade handles both via iframe+standard strategies.
  Login/register wall is common — shared password pool used as fallback.
