name: linkedin
version: 3

detect:
  domains:
    - linkedin.com

probe:
  best_strategy: dialog

patterns:
  already_applied:
    - "applied"
  easy_apply:
    - "easy apply"

properties:
  multi_page: true
  has_eeo: false
  has_progress_bar: true
  page_range: [1, 10]

notes: |
  Easy Apply modal opens as <dialog> element. Multi-page flow: fill fields
  on each page, click Next/Review/Submit. Auto-discovery handles all field
  types via ARIA labels and input selectors. File upload uses standard
  file input trigger. Ember.js/Glimmer picks up Playwright's real browser
  events — no CDP nativeValueSetter needed.
