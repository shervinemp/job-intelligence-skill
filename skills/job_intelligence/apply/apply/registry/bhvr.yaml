name: bhvr
version: 1

detect:
  domains:
    - bhvr.com

properties:
  multi_page: false
  has_eeo: true

notes: |
  WordPress site with custom job board plugin (bhvr-plugin-jobboard).
  Job posting page shows description. Apply triggers modal or redirect.
  EEOC likely present (has_eeo: true). Cascade handles field discovery.
