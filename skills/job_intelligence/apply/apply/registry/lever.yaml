name: lever
version: 3
notes: |
  0 fields → follow apply-link → /apply.
  Labels: <label><div>Text</div><div><input></div></label>.
  No Select/Radio.

detect:
  domains:
    - lever.co
probe:
  best_strategy: standard
patterns:
  already_applied:
    - "already applied"
  guest_apply:
    - "apply as guest"
    - "continue without signing in"
properties:
  multi_page: false
  has_eeo: false
